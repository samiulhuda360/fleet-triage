name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check fleet_triage tests
          ruff format --check fleet_triage tests
      - name: Tests
        run: pytest
      - name: Detection evaluation (no model)
        run: python -m fleet_triage.evaluation.detection --no-write
      - name: Triage evaluation (no model)
        run: python -m fleet_triage.evaluation.triage --modes bm25 rules --no-write
